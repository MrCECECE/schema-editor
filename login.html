<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Studio — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/screen.css">
</head>
<body class="theme-dark">
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1 class="login-title">Schema Studio</h1>
            <p class="login-subtitle">Для редактирования войдите или попробуйте демо-режим</p>

            <button id="btn-demo" class="btn btn-primary" type="button">Продолжить без входа (Demo)</button>

            <div class="login-divider">или</div>

            <form id="manual-login" class="login-form">
                <label class="field-label" for="username">Имя пользователя</label>
                <input type="text" id="username" class="text-input" placeholder="admin">
                <label class="field-label" for="password">Пароль</label>
                <input type="password" id="password" class="text-input" placeholder="••••••">
                <div id="error-msg" class="error-msg"></div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

            <p class="login-note">
                Demo-режим: все инструменты доступны, только локально.<br>
                Google Sign-In требует настройки Google Cloud Console.
            </p>

            <div class="theme-toggle-container">
                <button id="btn-theme-light" class="btn btn-secondary" type="button">🌞 Светлая тема</button>
                <button id="btn-theme-dark" class="btn btn-secondary" type="button">🌙 Темная тема</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
