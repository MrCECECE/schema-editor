<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — Schema Editor</title>
  <script>
    (function () {
      const key = 'schema_editor_theme';
      const saved = localStorage.getItem(key);
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/screen.css">
</head>
<body>
  <h1>Вход</h1>
  <button id="googleBtn" class="btn btn-google" disabled>Загрузка…</button>
  <a href="index.html" class="btn btn-ghost">← Назад</a>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/hotkeys.js"></script>

  <script>
    if (Auth.getSession()) {
      location.replace('editor.html');
    }
  </script>

  <script src="https://accounts.google.com/gsi/client"
    onload="
      initGoogleAuth(() => location.replace('editor.html'));
      const btn = document.getElementById('googleBtn');
      btn.disabled = false;
      btn.classList.add('btn', 'btn-google');
      btn.textContent = 'Войти с Google';
      btn.onclick = () => Auth.login();
    ">
  </script>
</body>
</html>
