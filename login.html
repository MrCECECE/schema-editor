<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Schema Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/screen.css">
  <script>
    (function () {
      const key = 'schema_editor_theme';
      const saved = localStorage.getItem(key);
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
<script>
  (function () {
    const t = localStorage.getItem('schema_editor_theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.body.classList.toggle('theme-dark', t === 'dark');
    document.body.classList.toggle('theme-light', t === 'light');
  })();
</script>

<div id="login-screen" class="screen">
  <div class="login-card">
    <h1 class="login-title">Schema Editor</h1>
    <p class="login-subtitle">Войдите, чтобы редактировать схемы</p>

    <div id="google-signin-container"></div>

    <div class="login-divider">или</div>

    <button id="googleBtn" class="btn btn-google" disabled>Загрузка…</button>

    <p class="login-note">
      Нужен Google-аккаунт с доступом к таблице.<br>
      Сессия сохраняется локально.
    </p>

    <div class="theme-toggle-bottom">
      <a href="index.html" class="btn btn-ghost">← На главную</a>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/theme.js"></script>

<script>
  if (Auth.getSession()) {
    location.replace('editor.html');
  }
</script>

<script src="https://accounts.google.com/gsi/client"
        onload="
        try {
            initGoogleAuth(() => location.replace('editor.html'));
            const btn = document.getElementById('googleBtn');
            btn.disabled = false;
            btn.textContent = 'Войти с Google';
            btn.onclick = () => Auth.login();
        } catch (e) {
            const btn = document.getElementById('googleBtn');
            btn.textContent = 'Google API не загрузился';
            btn.disabled = true;
        }
    "
        onerror="
        const btn = document.getElementById('googleBtn');
        btn.textContent = 'Google API недоступен';
        btn.disabled = true;
    ">
</script>
</body>
</html>
