<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
    <div id="editor-screen" class="screen">
        <header class="topbar">
            <div class="topbar-left">
                <span id="file-name" class="file-name">schema.json</span>
                <span id="save-status" class="save-status">—</span>
            </div>
            <div class="topbar-right">
                <button id="btn-export-png" class="btn btn-ghost" title="Экспорт в PNG">PNG</button>
                <button id="btn-export-svg" class="btn btn-ghost" title="Экспорт в SVG">SVG</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="toolbar">
                <div class="tool-group-label">Вид</div>
                <div class="tool-group">
                    <button id="btn-zoom-in" class="tool-btn" title="Приблизить"></button>
                    <button id="btn-zoom-out" class="tool-btn" title="Отдалить"></button>
                    <button id="btn-zoom-reset" class="tool-btn" title="100%"></button>
                    <button id="btn-grid" class="tool-btn active" title="Показать/скрыть сетку"></button>
                </div>
            </aside>

            <main class="canvas-area">
                <div id="canvas-container">
                    <canvas id="schema-canvas"></canvas>
                </div>
            </main>
        </div>

        <footer class="statusbar">
            <span id="status-zoom">100%</span>
            <span id="status-coords">x: 0, y: 0</span>
            <span id="status-mode">Просмотр</span>
            <span id="status-update">—</span>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
