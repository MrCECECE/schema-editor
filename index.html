<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Studio — Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/screen.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js" defer></script>
</head>
<body class="theme-dark">
    <div class="screen">
        <header class="topbar">
<div class="topbar-left">
            <span id="save-status" class="save-status">—</span>
        </div>
            <div class="topbar-right">
                <button id="btn-theme-toggle" class="btn-icon" title="Сменить тему">
                    <span class="theme-icon">🌙</span>
                </button>
                <button id="btn-export-png" class="btn btn-ghost" title="Экспорт в PNG">PNG</button>
                <button id="btn-export-svg" class="btn btn-ghost" title="Экспорт в SVG">SVG</button>
            </div>
        </header>

        <main class="canvas-area-full">
            <div id="canvas-container">
                <canvas id="schema-canvas"></canvas>
            </div>
            <div class="floating-controls">
                <button id="btn-zoom-in" class="btn-icon" title="Приблизить">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M16 16 L21 21 M11 8 V14 M8 11 H14"/></svg>
                </button>
                <button id="btn-zoom-out" class="btn-icon" title="Отдалить">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M16 16 L21 21 M8 11 H14"/></svg>
                </button>
                <button id="btn-zoom-reset" class="btn-icon" title="100%">100%</button>
            </div>
        </main>

        <footer class="statusbar">
            <span id="status-zoom">100%</span>
            <span id="status-coords">x: 0, y: 0</span>
            <span id="status-mode">Просмотр</span>
            <span id="status-update">—</span>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
