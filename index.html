<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schema Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script>
    (function () {
      const key = 'schema_editor_theme';
      const saved = localStorage.getItem(key);
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
<script>
  (function () {
    const t = localStorage.getItem('schema_editor_theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.body.classList.toggle('theme-dark', t === 'dark');
    document.body.classList.toggle('theme-light', t === 'light');
  })();
</script>

<div id="login-screen" class="screen">
  <div class="login-card">
    <h1 class="login-title">Schema Editor</h1>
    <p class="login-subtitle">Редактор схем</p>

    <a href="view.html" class="btn btn-primary" style="text-decoration:none;margin-bottom:12px;">
      👁 Посмотреть
    </a>
    <a href="login.html" class="btn btn-primary" style="text-decoration:none;">
      ✏️ Редактировать
    </a>

    <div class="login-divider">или</div>

    <button id="themeToggle" class="theme-switch" type="button" aria-label="Сменить тему">
            <span class="theme-switch-track">
                <span class="theme-switch-thumb"></span>
                <span class="theme-switch-icon icon-sun">☀️</span>
                <span class="theme-switch-icon icon-moon">🌙</span>
            </span>
      <span class="theme-switch-label">Сменить тему</span>
    </button>

    <p class="login-note">
      <b>V</b> — Viewer, <b>E</b> — Editor, <b>D</b> — тема, <b>?</b> — справка
    </p>
  </div>
</div>

<dialog id="hotkeyHelp">
  <h2>Горячие клавиши</h2>
  <ul>
    <li><b>V</b> — Открыть Viewer</li>
    <li><b>E</b> — Открыть Login (Editor)</li>
    <li><b>D</b> — Переключить тему</li>
    <li><b>?</b> / <b>H</b> — Эта справка</li>
  </ul>
  <button onclick="this.closest('dialog').close()">Закрыть</button>
</dialog>

<script src="assets/js/theme.js"></script>
<script src="assets/js/hotkeys.js"></script>
<script>
  document.getElementById('themeToggle').onclick = () => Theme.toggle();

  Hotkeys.bind({
    'v': () => location.href = 'view.html',
    'e': () => location.href = 'login.html',
    'd': () => Theme.toggle(),
    '?': () => document.getElementById('hotkeyHelp').showModal(),
    'h': () => document.getElementById('hotkeyHelp').showModal()
  });
</script>
</body>
</html>
