<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Schema Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      const key = 'schema_editor_theme';
      const saved = localStorage.getItem(key);
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="theme-dark">
<script>
  (function () {
    const t = localStorage.getItem('schema_editor_theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.body.classList.toggle('theme-dark', t === 'dark');
    document.body.classList.toggle('theme-light', t === 'light');
  })();
</script>
  <h1>Schema Editor</h1>

  <a href="view.html"><button class="btn btn-primary">Посмотреть</button></a>
  <a href="login.html"><button class="btn btn-primary">Редактировать</button></a>
  <button id="themeToggle" class="btn btn-ghost">🌓</button>

  <dialog id="hotkeyHelp">
    <h2>Горячие клавиши</h2>
    <ul>
      <li><b>V</b> — Посмотреть</li>
      <li><b>E</b> — Редактировать</li>
      <li><b>D</b> — Переключить тему</li>
      <li><b>?</b> / <b>H</b> — Эта справка</li>
    </ul>
    <button onclick="this.closest('dialog').close()">Закрыть</button>
  </dialog>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/hotkeys.js"></script>
  <script>
    document.getElementById('themeToggle').onclick = () => Theme.toggle();

    Hotkeys.bind({
      'v': () => location.href = 'view.html',
      'e': () => location.href = 'login.html',
      'd': () => Theme.toggle(),
      '?': () => document.getElementById('hotkeyHelp').showModal(),
      'h': () => document.getElementById('hotkeyHelp').showModal()
    });
  </script>
</body>
</html>
